target-version = "py311"
line-length = 88
# Project root, so `app` and `tests` resolve as first-party packages.
src = ["."]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # unused arguments
    "SIM",  # flake8-simplify
    "BLE",  # no blind `except Exception` without an explicit waiver
    "PTH",  # use pathlib
    "RUF",  # ruff-specific
]
# Deliberately NOT enabled: "TCH" (flake8-type-checking). It cannot tell that
# Pydantic and FastAPI resolve annotations at runtime, so it suggests moving
# imports such as `datetime` in schemas/item.py or `Depends`-backed aliases in
# api/deps.py into TYPE_CHECKING blocks -- which breaks model and route
# construction at import time.
ignore = [
    "E501",  # line length is enforced by the formatter
    "B008",  # FastAPI's Depends()/Query() defaults are the documented idiom
]

[lint.per-file-ignores]
"tests/*" = ["ARG001", "S101"]

[lint.isort]
known-first-party = ["app", "tests"]

[format]
quote-style = "double"
