[mypy]
# 3.12 because that is the interpreter the venv is built on, and numpy's
# stubs (pulled in by opencv-python) use syntax mypy rejects below it.
python_version = 3.12
plugins = pydantic.mypy
strict = True
warn_unreachable = True
# FastAPI's route decorators are untyped; flagging them adds noise, not safety.
disallow_untyped_decorators = False
files = app

[mypy-tests.*]
disallow_untyped_defs = False

# simpleobsws ships no py.typed marker.
[mypy-simpleobsws.*]
ignore_missing_imports = True

# torchvision ships no py.typed marker (torch itself does), so the model builder
# and the transform pipeline come back untyped. Only app/utils/symbol_model.py
# and the lazy version probe in app/services/image_classifier.py touch it.
[mypy-torchvision.*]
ignore_missing_imports = True
